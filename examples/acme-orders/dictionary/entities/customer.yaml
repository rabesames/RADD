entity: Customer
description: A person or company that places orders.
primaryKey: id
fields:
  id:
    type: guid
    generated: uuid
    description: Surrogate key, generated by the application on create.
  name:
    type: string
    maxLength: 120
    required: true
    description: Full name of the person, or the registered company name.
    tags: [pii]
  email:
    domain: Email
    required: true
    validators: [{ name: uniqueCustomerEmail, severity: error }]
    description: Contact email; must be unique across customers.
  mobileNumber:
    domain: MobileNumber
    description: Philippine mobile number for delivery updates, stored as 11 digits.
  gender:
    type: string
    maxLength: 1
    lookup: { list: gender }
    description: Optional; only for individual customers.
    tags: [pii]
  countryCode:
    type: string
    maxLength: 2
    required: true
    lookup: { entity: Country, value: code, display: name, cache: static }
    description: Country of the billing address.
  provinceId:
    type: integer
    lookup:
      entity: Province
      value: id
      display: name
      cache: ttl
      filter: "row.countryCode == countryCode"
      dependsOn: [countryCode]
    description: Province of the billing address; must belong to the chosen country.
  creditLimit:
    domain: Money
    min: 0
    max: 10000000
    description: Maximum unpaid balance allowed before new orders are held.
  vipNotes:
    type: text
    rules:
      - when: "creditLimit > 1000000.0"
        required: true
        severity: warning
        message: customer.vipNotes.recommended
    description: Account manager notes, recommended for customers with very high credit limits.
relationships:
  orders: { kind: oneToMany, entity: Order, foreignKey: customerId }
