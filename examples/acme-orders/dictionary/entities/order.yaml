entity: Order
description: An order placed by a customer.
primaryKey: id
audit: true
fields:
  id:
    type: guid
    generated: uuid
    description: Surrogate key, generated by the application on create.
  customerId:
    type: guid
    required: true
    readOnly: onUpdate
    lookup: { entity: Customer, value: id, display: name, cache: dynamic, search: true }
    description: The customer who placed the order; cannot change after create.
  orderDate:
    type: date
    required: true
    displayFormat: { kind: date, style: medium }
    editFormat: { kind: date, pattern: "yyyy-MM-dd" }
    description: Date the order was placed.
  notes:
    type: text
    description: Free-text notes from the customer.
relationships:
  customer: { kind: manyToOne, entity: Customer, foreignKey: customerId }
  lines: { kind: oneToMany, entity: OrderLine, foreignKey: orderId }
