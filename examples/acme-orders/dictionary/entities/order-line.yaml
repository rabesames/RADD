entity: OrderLine
description: One product line of an order.
primaryKey: id
fields:
  id:
    type: guid
    generated: uuid
    description: Surrogate key, generated by the application on create.
  orderId:
    type: guid
    required: true
    references: { entity: Order, onDelete: cascade }
    description: The order this line belongs to.
  lineNumber:
    type: integer
    required: true
    min: 1
    description: Position of the line within the order, starting at 1.
  productName:
    type: string
    maxLength: 120
    required: true
    description: Name of the product as shown on the order.
  quantity:
    type: integer
    required: true
    min: 1
    description: Number of units ordered.
  unitPrice:
    domain: Money
    required: true
    min: 0
    description: Price of one unit at the time of ordering.
  lineTotal:
    type: decimal
    precision: 14
    scale: 2
    computed: { source: application, expression: "dec.mul(quantity, unitPrice)", persisted: true }
    description: quantity times unitPrice, computed on every save.
indexes:
  - { fields: [orderId, lineNumber], unique: true, description: Line numbers are unique within an order. }
relationships:
  order: { kind: manyToOne, entity: Order, foreignKey: orderId }
