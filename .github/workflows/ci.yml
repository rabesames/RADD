name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install and build
        run: npm ci
      - name: Format and code lint
        run: npm run check
      - name: Generated schemas match schema/src
        run: npm run schema:check
      - name: Tests
        run: npm test
      - name: Lint the example dictionary
        run: npx radd lint examples/acme-orders/dictionary
      - name: Build the example dictionary
        run: npx radd build examples/acme-orders/dictionary

  dotnet:
    name: .NET build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json
      - name: Build
        run: dotnet build dotnet/RADD.slnx --configuration Release

  adr:
    name: ADR check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check ADR immutability and index
        if: github.event_name == 'pull_request'
        run: node scripts/check-adrs.mjs --base "origin/${{ github.base_ref }}"
      - name: Check ADR index
        if: github.event_name != 'pull_request'
        run: node scripts/check-adrs.mjs
